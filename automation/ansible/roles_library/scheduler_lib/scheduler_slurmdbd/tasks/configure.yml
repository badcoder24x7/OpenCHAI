---
# ============================================================
# Users and Groups
# ============================================================

- name: Ensure munge group exists
  ansible.builtin.group:
    name: "{{ munge_group }}"
    gid: "{{ munge_gid }}"
    state: present
  ignore_errors: true


- name: Ensure munge user exists
  ansible.builtin.user:
    name: "{{ munge_user }}"
    uid: "{{ munge_uid }}"
    group: "{{ munge_group }}"
    home: /var/lib/munge
    shell: /sbin/nologin
    create_home: yes
    state: present
  ignore_errors: true

- name: Ensure slurm group exists
  ansible.builtin.group:
    name: "{{ slurm_group }}"
    gid: "{{ slurm_gid }}"
    state: present

- name: Ensure slurm user exists
  ansible.builtin.user:
    name: "{{ slurm_user }}"
    uid: "{{ slurm_uid }}"
    group: "{{ slurm_group }}"
    home: /var/lib/slurm
    shell: /bin/bash
    create_home: yes
    state: present

- name: Remove old ANSIBLE SLURMDBD CONFIG block
  ansible.builtin.blockinfile:
    path: "{{ slurmdbd_conf }}"
    marker: "# {mark} ANSIBLE SLURMDBD CONFIG"
    state: absent
  ignore_errors: true

- name: Deploy slurmdbd.conf (authoritative)
  ansible.builtin.template:
    src: slurmdbd.conf.j2
    dest: "{{ slurmdbd_conf }}"
    owner: slurm
    group: slurm
    mode: "0600"
  notify: Restart slurmdbd


- name: Ensure AccountingStorageType is set to slurmdbd
  ansible.builtin.lineinfile:
    path: /etc/slurm/slurm.conf
    regexp: '^AccountingStorageType='
    line: 'AccountingStorageType=accounting_storage/slurmdbd'
    create: yes
    backup: yes
  notify: Restart slurmctld
  ignore_errors: true

- name: Ensure Slurm log directory exists
  ansible.builtin.file:
    path: /var/log/slurm
    state: directory
    owner: slurm
    group: slurm
    mode: "0755"

- name: Ensure slurmdbd log file exists
  ansible.builtin.file:
    path: "{{ slurmdbd_log }}"
    state: touch
    owner: slurm
    group: slurm
    mode: "0644"

- name: Ensure slurmdbd.conf ownership and permissions
  ansible.builtin.file:
    path: "{{ slurmdbd_conf }}"
    owner: slurm
    group: slurm
    mode: "0600"

# ============================================================
# Directories
# ============================================================

- name: Copy munge key to client node
  ansible.builtin.copy:
    src: "{{ openchai_vault_path }}/mount/slurm_config/munge.key"
    dest: /etc/munge/munge.key
    remote_src: true
    owner: root
    group: root
    mode: '0644'

- name: Ensure Munge directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ munge_user }}"
    group: "{{ munge_group }}"
    mode: "0755"
  loop:
    - /etc/munge
    - /var/log/munge
    - /run/munge

- name: Set munge key permissions
  ansible.builtin.file:
    path: /etc/munge/munge.key
    owner: "{{ munge_user }}"
    group: "{{ munge_group }}"
    mode: "0400"

