# =========================================================
# Base Repositories
# =========================================================

- name: Install EPEL release
  ansible.builtin.dnf:
    name: epel-release
    state: present
  failed_when: false

- name: Enable CRB or PowerTools repository
  ansible.builtin.shell: |
    dnf config-manager --set-enabled crb ||
    dnf config-manager --set-enabled powertools
  args:
    executable: /bin/bash
  changed_when: false
  failed_when: false



# =========================================================
# Authentication Packages
# All local RPMs in ONE transaction → Online fallback
# =========================================================

- name: Check installed authentication packages
  ansible.builtin.command:
    argv:
      - rpm
      - -q
      - "{{ item }}"
  loop: "{{ auth_packages }}"
  register: auth_check
  failed_when: false
  changed_when: false

- name: Identify missing authentication packages
  ansible.builtin.set_fact:
    missing_auth_pkgs: >-
      {{
        auth_check.results
        | selectattr('rc', 'ne', 0)
        | map(attribute='item')
        | list
      }}

# ---------------------------------------------------------
# Find every RPM in the curated auth directory
# ---------------------------------------------------------

- name: Locate all local authentication RPMs
  ansible.builtin.find:
    paths: "{{ slurm_rpm_base }}/auth"
    patterns: "*.rpm"
    file_type: file
    recurse: false
  register: auth_rpm_files
  when: missing_auth_pkgs | length > 0

- name: Build complete local authentication RPM transaction
  ansible.builtin.set_fact:
    auth_local_rpm_paths: >-
      {{
        auth_rpm_files.files | default([])
        | map(attribute='path')
        | list
      }}
  when: missing_auth_pkgs | length > 0

- name: Debug authentication RPM transaction
  ansible.builtin.debug:
    msg:
      missing_packages: "{{ missing_auth_pkgs }}"
      rpm_count: "{{ auth_local_rpm_paths | default([]) | length }}"
      local_rpms: >-
        {{
          auth_local_rpm_paths | default([])
          | map('basename')
          | list
        }}
  when: missing_auth_pkgs | length > 0

# ---------------------------------------------------------
# Install all local auth RPMs in ONE rpm transaction
# ---------------------------------------------------------

- name: Install all local authentication RPMs in one transaction
  ansible.builtin.command:
    argv: "{{ ['rpm', '-Uvh'] + auth_local_rpm_paths }}"
  register: auth_rpm_install
  failed_when: false
  changed_when: auth_rpm_install.rc == 0
  when:
    - missing_auth_pkgs | length > 0
    - auth_local_rpm_paths | default([]) | length > 0

- name: Debug local authentication RPM result
  ansible.builtin.debug:
    msg:
      rc: "{{ auth_rpm_install.rc | default('not-run') }}"
      stdout: "{{ auth_rpm_install.stdout | default('') }}"
      stderr: "{{ auth_rpm_install.stderr | default('') }}"
  when: auth_rpm_install is defined

# ---------------------------------------------------------
# Recheck only required packages
# ---------------------------------------------------------

- name: Recheck authentication packages
  ansible.builtin.command:
    argv:
      - rpm
      - -q
      - "{{ item }}"
  loop: "{{ missing_auth_pkgs }}"
  register: auth_post_local
  failed_when: false
  changed_when: false
  when: missing_auth_pkgs | length > 0

- name: Identify authentication packages still missing
  ansible.builtin.set_fact:
    still_missing_auth_pkgs: >-
      {{
        auth_post_local.results | default([])
        | selectattr('rc', 'ne', 0)
        | map(attribute='item')
        | list
      }}

- name: Debug packages requiring online fallback
  ansible.builtin.debug:
    var: still_missing_auth_pkgs

# ---------------------------------------------------------
# Online fallback
# ---------------------------------------------------------

- name: Install remaining authentication packages online
  ansible.builtin.dnf:
    name: "{{ still_missing_auth_pkgs }}"
    state: present
  when: still_missing_auth_pkgs | length > 0
  ignore_errors: true

