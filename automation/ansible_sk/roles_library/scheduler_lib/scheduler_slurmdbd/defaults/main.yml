---

# ============================================================
# Users and Groups
# ============================================================
slurm_user: slurm
slurm_group: slurm
slurm_uid: 900
slurm_gid: 900

munge_user: munge
munge_group: munge
munge_uid: 971
munge_gid: 968


slurmdbd_conf: /etc/slurm/slurmdbd.conf
slurmdbd_log: /var/log/slurm/slurmdbd.log

slurmdbd_host: "{{ inventory_hostname }}"
slurmdbd_port: 6819

slurmdb_storage_host: localhost
slurmdb_storage_loc: slurm_acct_db
slurmdb_storage_user: slurm
slurmdb_storage_pass: "{{ vault_slurmdb_password }}"   # ⚠ override securely

# Define excluded packages per role
slurm_excluded_packages:
  db:
    - slurm-slurmd     # exclude only the main slurm rpm
    - slurm-slurmctld

# Authentication packages
auth_packages:
  - hdf5
  - http-parser
  - hwloc-libs
  - infiniband-diags
  - libaec
  - libibumad
  - libjwt
  - llhttp
  - munge
  - munge-libs
  - perl
  - perl-English
