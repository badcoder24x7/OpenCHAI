[defaults]
# Dynamic inventory via the wrapper script
inventory = /opt/OpenCHAI_Registry/july/OpenCHAI/automation/ansible/inventory/inventory.sh
host_key_checking  = False
retry_files_enabled = False
stdout_callback    = yaml
collections_path   = ./collections

# Vault password file (chmod 600, gitignored)
vault_password_file = /opt/OpenCHAI_Registry/july/OpenCHAI/automation/ansible/.vault_pass

[inventory]
enable_plugins = host_list, script, auto, json, txt, ini
# Inventory script caching (useful for 10k+ node clusters)
cache              = yes
cache_plugin       = jsonfile
cache_connection   = /tmp/ansible_inventory_cache
cache_timeout      = 120

[ssh_connection]
ssh_args           = -C -o ControlMaster=auto -o ControlPersist=60s
pipelining         = True
